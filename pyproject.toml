[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prophet-bench"
version = "0.1.0"
description = "PROPHET: Probabilistic Reliability via Outcome-Pricing for Honest Evaluation of agenT calibration. A benchmark for calibrated LLM agent confidence under economic pressure."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "PROPHET Authors"},
]
requires-python = ">=3.10,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "tqdm>=4.66",
    "rich>=13.7",
    "typer>=0.12",
    "tenacity>=8.2",
    "orjson>=3.10",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "datasets>=2.18",
    "huggingface_hub>=0.23",
    "tokenizers>=0.19",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jinja2>=3.1",
    "wandb>=0.16",
    "httpx>=0.27",
    "anyio>=4.3",
    "aiolimiter>=1.1",
]

[project.optional-dependencies]
api = [
    "openai>=1.30",
    "anthropic>=0.30",
    "google-genai>=0.5",
    "together>=1.2",
]
local = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.34",
    "bitsandbytes>=0.43",
    "sentencepiece>=0.2",
]
vllm = [
    "vllm>=0.6,<0.10",
    "openai>=1.30",
]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipython>=8.22",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]
paper = [
    "tabulate>=0.9",
    "pylatex>=1.4",
]
all = ["prophet-bench[api,local,dev,paper]"]

[project.scripts]
prophet = "prophet.cli:app"

[project.urls]
Homepage = "https://github.com/prophet-bench/prophet"
Repository = "https://github.com/prophet-bench/prophet"
Documentation = "https://github.com/prophet-bench/prophet#readme"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"prophet" = ["py.typed", "data/**/*.json", "data/**/*.yaml"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
exclude = ["build/", "dist/", "tests/"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
asyncio_mode = "auto"
